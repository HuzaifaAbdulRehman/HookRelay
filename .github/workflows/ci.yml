name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs. A tag is mutable, so `@v7` is a promise the
# publisher can change under you.
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://hookrelay:hookrelay@localhost:5432/hookrelay
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: install would resolve fresh and could pick up a version
      # the lockfile never saw.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
